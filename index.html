<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todoinclass</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="container">
    <h1>Todo App</h1>
    <form class="todo-form">
       <input type="text" placeholder="Add a new to do" id="todo-input">
       <select id="priority-select">
       <option value="">No priority</option>
       <option value="low">Low</option>
       <option value="medium">Medium</option>
       <option value="high">High</option>
       </select>
       <button type="submit"Add">Add</button>
    </form>
    <p id="error-message">Please enter a todo item</p>
    
    <ul class="todo-list" id="todo-list"></ul>
    <button id="clear-completed">Clear completed</button>
    <progress id="progress-bar" value="0" max="100"></progress>
    <p id="progress-text">0% done</p>
    <div class="export-import">
  <button type="button" id="export-button">Export</button>
  <button type="button" id="pdf-button">PDF</button>
  <label for="import-file" class="import-label">Import</label>
  <input type="file" id="import-file" accept=".json">
</div>

    <input type="color" id="colorPicker" value="#f4f4f4">

  </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
